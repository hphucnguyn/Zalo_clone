# Chi chay PostgreSQL trong Docker. Server Java + Client JavaFX chay tren may (khong dong goi).
# Dung:  cp .env.example .env  (doi mat khau)  ->  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: zalo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zalo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    # Chi mo cong cho chinh may nay (127.0.0.1), may khac trong LAN khong noi thang duoc vao DB
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d zalo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
