# ===== Server =====
server.host=127.0.0.1
server.port=5000
connect.timeoutMillis=5000
# TLS: chi tin cay Public Certificate cua server (KHONG co private key)
tls.truststore.path=certificates/server.crt
tls.protocols=TLSv1.3,TLSv1.2
# hostname phai khop CN/SAN trong chung chi (localhost, IP...)
tls.expectedHost=localhost

# ===== Heartbeat / reconnect =====
heartbeat.intervalSeconds=30
reconnect.maxAttempts=5
reconnect.delaySeconds=3

# ===== Upload / Download =====
download.dir=downloads
upload.chunkBytes=32768

# ===== Cache SQLite (xem lai lich su khi mat mang) =====
# Moi tai khoan 1 file rieng: data/cache/<username>.db  (khong luu mat khau/token)
cache.enabled=true
cache.dir=data/cache
cache.maxMessagesPerConversation=2000

# ===== UI =====
ui.title=Zalo Clone
ui.theme=light
ui.timeFormat=HH:mm
ui.dateFormat=dd/MM/yyyy
ui.historyPageSize=50
