# ===== Network =====
server.host=0.0.0.0
server.port=5000
server.backlog=100
# so thread xu ly client toi da (ExecutorService thay cho new Thread)
server.maxClients=500
# ngat client im lang qua N giay (SO_TIMEOUT)
server.readTimeoutSeconds=120

# ===== TLS (mat khau KHONG de trong file nay, doc tu bien moi truong) =====
tls.keystore.path=certificates/server.p12
tls.keystore.type=PKCS12
tls.keystore.passwordEnv=CHAT_CERT_PASSWORD
tls.protocols=TLSv1.3,TLSv1.2
# server KHONG yeu cau client cert
tls.needClientAuth=false

# ===== Protocol =====
# gioi han 1 dong JSON (bytes) - chong gui tin qua lon
protocol.maxLineBytes=65536
protocol.charset=UTF-8
# file/image/video/sound gui theo chunk (bytes truoc khi base64)
protocol.fileChunkBytes=32768

# ===== Auth =====
auth.bcrypt.rounds=12
auth.maxLoginAttempts=5
auth.lockSeconds=60

# ===== Database (PostgreSQL trong Docker) =====
# Chi SERVER duoc ket noi DB. Client KHONG bao gio co URL/user/password DB.
db.url=jdbc:postgresql://localhost:5433/zalo
# user/password doc tu bien moi truong (cung gia tri voi file .env cua docker-compose)
db.user.env=DB_USER
db.password.env=DB_PASSWORD
db.schema=schema.sql

# ===== HikariCP (connection pool) =====
# QUY TAC: khong dung DriverManager.getConnection(). Moi cau lenh muon 1 connection
# tu pool trong try-with-resources roi tra lai ngay. KHONG giu connection suot doi client.
# 5-500 client dung chung ~10 connection; pool.max phai < max_connections cua PostgreSQL.
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=3000
db.pool.idleTimeoutMs=300000
db.pool.maxLifetimeMs=1800000

# ===== Storage cho file / anh / video / am thanh =====
storage.uploadDir=data/uploads
storage.maxFileMB=50
storage.maxImageMB=10
storage.maxVideoMB=100
storage.maxSoundMB=20
storage.allowedImageExt=jpg,jpeg,png,gif,webp
storage.allowedVideoExt=mp4,webm,mov
storage.allowedSoundExt=mp3,wav,ogg,m4a

# ===== History =====
history.pageSize=50
